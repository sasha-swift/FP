<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineTask</title>
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фоновое видео -->
    <video id="video-bg" class="video-bg" src="assets/visuals/end_bg.mp4" autoplay muted loop playsinline></video>

    <div class="logo-container">
        <img src="assets/visuals/logo.png" alt="Logo" class="logo">
    </div>

    <!-- Основной контейнер -->
    <div class="main-wrapper">
        <div class="mc-gui mc-panel">
            <div class="middle inventory-container">
                
                <!-- Панель создания новой задачи -->
                <div class="crafting-table">
                    <input type="text" id="task-input" class="mc-input task-input-wide" placeholder="New task...">
                    <input type="date" id="date-input" class="mc-input date-input-small" lang="en">
                    
                    <label class="mc-checkbox-label" title="Important Task">
                        <input type="checkbox" id="diamond-input" class="mc-checkbox">
                        <span class="checkbox-custom diamond-checkbox">
                            <img src="assets/visuals/diamond.png" alt="" class="diamond-icon">
                        </span>
                    </label>
                    
                    <button id="add-btn" class="mc-btn">Add</button>
                </div>

                <!-- Панель фильтрации списка задач -->
                <div class="filters-row">
                    <div class="filters">
                        <button class="mc-btn small active" data-filter="all">All</button>
                        <button class="mc-btn small" data-filter="active">Active</button>
                        <button class="mc-btn small" data-filter="completed">Completed</button>
                        <button class="mc-btn small diamond-filter" data-filter="important">Important</button>
                    </div>
                </div>

                <!-- Контейнер для списка задач -->
                <div id="task-list" class="task-grid"></div>
            </div>
        </div>
    </div>

    <!-- Попугаи -->
    <div class="dancing-parrot parrot-left" id="parrot-left">
        <img src="assets/visuals/parrot2.gif" alt="Dancing Parrot" class="parrot-img">
    </div>
    <div class="dancing-parrot parrot-right" id="parrot-right">
        <img src="assets/visuals/parrot.gif" alt="Dancing Parrot" class="parrot-img">
    </div>

    <!-- Модальное окно проигрывателя -->
    <div class="jukebox-overlay" id="jukebox-overlay">
        <div class="jukebox-modal mc-panel">
            <div class="jb-middle">
                <!-- Статус проигрывателя -->
                <div class="jukebox-status" id="jukebox-status">???</div>
                
                <div class="jukebox-content">
                    <!-- Проигрыватель -->
                    <div class="jukebox-drop-zone" id="jukebox-drop">
                        <img src="assets/visuals/jukebox.png" alt="Jukebox" class="jukebox-img">
                    </div>
                    
                    <!-- Музыкальный диск -->
                    <div class="disc-drag-zone">
                        <div class="disc-draggable" id="music-disc" draggable="true">
                            <img src="assets/visuals/music_disc.png" alt="Music Disc" class="disc-img">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Скрытая кнопка -->
    <div class="jukebox-cat" id="jukebox-cat" title="???">
        <img src="assets/visuals/lol.png" alt="???" class="lol-cat">
    </div>

    <script src="script.js"></script>
</body>
</html>
